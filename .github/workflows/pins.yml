name: pin program builds
# Pins the newest build of every program, with its SHA-256, in tools/pins.json (./kit pins) and commits it when it
# changed, so the next release installs exactly those builds. A program whose file changed under the same version
# fails the run, and nothing is committed until someone finds out why.
# Only the commit job can write to the repo, and it runs none of the kit's code: the build job, which talks to
# every publisher, has a read-only token and hands its result over as an artifact.
on:
  schedule:
    - cron: "41 6 * * 6"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main     # a scheduled run starts on the default branch; releases are cut from main
          persist-credentials: false
      - run: ./kit pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pins
          path: tools/pins.json
          retention-days: 1

  commit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pins
          path: ${{ runner.temp }}/pins
      - name: commit the new pins, if they only change versions and SHA-256s of programs the kit downloads
        env:
          NEW: ${{ runner.temp }}/pins/pins.json
        run: |
          python3 -I - "$NEW" tools/pins.json kit.json <<'PY'
          import json, re, sys
          new, old, kit = (json.load(open(p)) for p in sys.argv[1:4])
          # kit.json's programs, and the map viewer's three that the kit's program lists itself
          known = {e.get("id") for s in ("runtimes", "extras") for e in kit.get(s, [])}
          known |= {"maplibre-gl", "protomaps-basemaps", "basemaps-assets"}
          word = re.compile(r"[\w.+-]{1,64}")
          ok = new.pop("_readme", None) == old.get("_readme") and new and all(
              k in known and type(v) is dict and set(v) <= {"version", "sha256"}
              and type(v.get("version")) is str and word.fullmatch(v["version"])
              and re.fullmatch(r"[0-9a-f]{64}", str(v.get("sha256", "0" * 64))) for k, v in new.items())
          sys.exit(0 if ok else "The new pins.json changes its note, names a program the kit doesn't download, or has an "
                   "entry that isn't a version and a SHA-256, so it isn't committed. Run ./kit pins by hand and read its diff.")
          PY
          cp "$NEW" tools/pins.json
          git diff --quiet tools/ && { echo "no change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pin the newest program builds" tools/pins.json
          git pull --rebase origin main
          git push origin HEAD:main
