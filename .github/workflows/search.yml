name: kiwix search
# Cloud agent sessions can't reach library.kiwix.org; run `./kit search` here instead.
on:
  workflow_dispatch:
    inputs:
      words:
        description: "Words to search for, comma-separated for several searches"
        required: true
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          WORDS: ${{ inputs.words }}
        run: |
          set -f    # the words are search terms, never file patterns
          IFS=',' read -ra Q <<< "$WORDS"
          for q in "${Q[@]}"; do echo "### $q"; ./kit search $q | head -25; echo; done
