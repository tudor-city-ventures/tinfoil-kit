name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quick-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: tests/check.sh
  oldest-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"     # what macOS's command line tools install
      - run: python tests/sync_test.py
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: npm i --no-save axe-core@4.10.2
      - run: python3 tests/site_test.py
        env:
          KIT_AXE: node_modules/axe-core/axe.min.js
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: site-screenshots
          path: tests/work/shots
