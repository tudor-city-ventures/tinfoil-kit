name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quick-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: tests/check.sh
  oldest-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # 3.9 is what macOS's command line tools install. setup-python has no 3.9 for current runners; uv does.
      - run: pip install uv && uv run --no-project --python 3.9 tests/sync_test.py
  bash-3-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # macOS still ships bash 3.2: run the sync test, which drives SETUP.command and the launcher, with it.
      - run: >-
          docker run --rm -v "$PWD:/kit" -w /kit bash:3.2
          sh -c 'apk add -q python3 curl && ln -sf /usr/local/bin/bash /bin/bash && bash --version | head -1 && python3 tests/sync_test.py'
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: npm i --no-save axe-core@4.10.2
      - run: python3 tests/site_test.py
        env:
          KIT_AXE: node_modules/axe-core/axe.min.js
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: site-screenshots
          path: tests/work/shots
  sign-off:
    # Outside contributors sign off every commit (the DCO, see .github/CONTRIBUTING.md). Branches in this repo
    # are the maintainers', so the job skips them, and a skipped job counts as passing for required checks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # The checkout is GitHub's merge commit: its first parent is the base branch, its second the pull request.
      - run: |
          bad=0
          for c in $(git rev-list --no-merges HEAD^1..HEAD^2); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' && continue
            echo "::error::Commit $(git rev-parse --short "$c") has no Signed-off-by line. Sign off with git commit -s (see .github/CONTRIBUTING.md)."
            bad=1
          done
          exit $bad
