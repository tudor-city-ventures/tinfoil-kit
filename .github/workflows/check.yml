name: check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:    # a commit a workflow pushed starts no checks, and a release needs them
permissions:
  contents: read
jobs:
  quick-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # the developer tools in package.json, for the formatting and lint of the kit page, the website and the
      # JavaScript tests, with no install scripts
      - run: npm ci --ignore-scripts
      # ruff, for the Python's lint and formatting, at the version ruff.toml requires
      - run: pipx install "ruff$(sed -n 's/^required-version = "\([^"]*\)".*/\1/p' ruff.toml)"
      - run: tests/check.sh
      # The SHA-256 of the kit's own program as check.sh built it from this commit. .github/release.sh builds it
      # again on the maintainer's Mac and publishes only if they match.
      - run: cd tools && sha256sum tinfoilkit-*
  bash-3-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # macOS still ships bash 3.2: run the sync test, which drives SETUP.command and the launcher, with it, on the
      # kit's own program built here (Go fetches the version build.sh pins).
      - run: tools/tinfoilkit/build.sh
      - run: >-
          docker run --rm -v "$PWD:/kit" -w /kit bash:3.2
          sh -c 'apk add -q python3 curl procps && ln -sf /usr/local/bin/bash /bin/bash && bash --version | head -1 && python3 tests/sync_test.py'
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # the site is a Next.js app: its exact packages, with no install scripts (the test builds it)
      - run: npm ci --ignore-scripts
        working-directory: site
      - run: pip install playwright && playwright install --with-deps chromium
      - run: npm ci --ignore-scripts    # axe-core, for the accessibility checks, from package.json
      # the kit's own program, which the test gives the kit builder's options to (Go fetches the version build.sh pins)
      - run: tools/tinfoilkit/build.sh
      - run: python3 tests/site_test.py
        env:
          KIT_AXE: node_modules/axe-core/axe.min.js
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-screenshots
          path: tests/work/shots
  sign-off:
    # Outside contributors sign off every commit (the DCO, see .github/CONTRIBUTING.md). Branches in this repo
    # are the maintainers', so the job skips them, and a skipped job counts as passing for required checks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The checkout is GitHub's merge commit: its first parent is the base branch, its second the pull request.
      - run: |
          bad=0
          for c in $(git rev-list --no-merges HEAD^1..HEAD^2); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' && continue
            echo "::error::Commit $(git rev-parse --short "$c") has no Signed-off-by line. Sign off with git commit -s (see .github/CONTRIBUTING.md)."
            bad=1
          done
          exit $bad
