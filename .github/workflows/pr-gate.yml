name: contribution gate
# Outside pull requests must link an open issue the maintainer labeled `accepted` (.github/CONTRIBUTING.md),
# and can't change CI, this gate or release signing without the maintainer merging past a failed check.
# Outside issues must come through a form. pull_request_target and issues run this file with a write token
# on strangers' input, so it never checks out or runs anything, and reads them only through the API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  issues:
    types: [opened]
  workflow_dispatch: # run once by hand to create or update the labels below
permissions: {}
jobs:
  gate:
    if: github.event_name == 'pull_request_target' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const full = `${owner}/${repo}`;

            // Branches in this repo come from people with write access. Members, collaborators (including
            // read-only ones the maintainer vouched for) and anyone with a merged commit skip the gate too.
            const here = !!pr.head.repo && pr.head.repo.full_name.toLowerCase() === full.toLowerCase();
            if (here || ['OWNER', 'MEMBER', 'COLLABORATOR', 'CONTRIBUTOR'].includes(pr.author_association)) {
              return core.info(`Skipped: ${here ? 'branch in this repo' : pr.author_association}`);
            }
            // Someone other than the author reopening it is a maintainer making the call.
            if (context.payload.action === 'reopened' && context.payload.sender.login !== pr.user.login) {
              return core.info(`Skipped: reopened by ${context.payload.sender.login}`);
            }

            // Any issue of this repo the title or description mentions counts, however it's written.
            const name = full.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const text = `${pr.title}\n${pr.body || ''}`;
            const numbers = new Set();
            for (const re of [/(?:^|[^\w/])#(\d+)\b/g, new RegExp(`\\b${name}#(\\d+)\\b`, 'gi'),
                              new RegExp(`github\\.com/${name}/issues/(\\d+)`, 'gi')]) {
              for (const m of text.matchAll(re)) numbers.add(Number(m[1]));
            }
            for (const n of [...numbers].slice(0, 10)) {
              const issue = await github.rest.issues.get({ owner, repo, issue_number: n }).then(r => r.data, () => null);
              if (issue && !issue.pull_request && issue.state === 'open' && issue.labels.some(l => l.name === 'accepted')) {
                return core.info(`Allowed: links accepted issue #${n}`);
              }
            }

            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body:
              "Thanks for this. Pull requests here need an open issue that the maintainer has labeled `accepted`, " +
              "and this one doesn't link one, so it's closed.\n\n" +
              "Open an issue describing the change (or find an accepted one), wait for the label, then open a new " +
              `pull request that says \`Closes #<number>\`. See [CONTRIBUTING](https://github.com/${full}/blob/main/.github/CONTRIBUTING.md).` });
            await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['auto-closed'] })
              .catch(e => core.warning(`Couldn't label it: ${e.message}`));
            core.info('Closed: no accepted issue');
  protected-files:
    # A required check once the main ruleset is on. A pull request's own workflows can't vouch for it: it can
    # edit them to pass. This one runs from the base branch, so it fails until the maintainer merges on purpose.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            if (pr.head.repo && pr.head.repo.full_name.toLowerCase() === `${owner}/${repo}`.toLowerCase()) {
              return core.info('Skipped: branch in this repo');
            }
            // What decides how CI runs, who reviews, what a release holds, which program builds it installs and which key signs it
            // (mac/build.sh runs with the Mac app's signing certificate at hand).
            const guarded = /^(\.github\/(workflows\/|CODEOWNERS$|dependabot\.yml$|release\.sh$)|\.gitattributes$|tools\/(release-signers|pins\.json)$|mac\/build\.sh$)/;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            if (files.length < pr.changed_files) {
              return core.setFailed(`GitHub lists ${files.length} of this pull request's ${pr.changed_files} files, so it can't be checked.`);
            }
            const hits = [...new Set(files.flatMap(f => [f.filename, f.previous_filename]).filter(f => f && guarded.test(f)))];
            if (!hits.length) return core.info('No protected files changed');
            core.setFailed(`This pull request changes ${hits.join(', ')}, which decide how CI, reviews or releases work. ` +
              'Only the maintainer can merge it, after reading those changes.');
  forms:
    # Bots and agents file issues through the API or `gh`, which skip the forms and the questions that make a
    # report usable. GitHub can't require a form there, so this closes what came without one.
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            // Members, collaborators, past contributors and the repo's own apps file issues however they like.
            if (issue.user.type === 'Bot' || ['OWNER', 'MEMBER', 'COLLABORATOR', 'CONTRIBUTOR'].includes(issue.author_association)) {
              return core.info(`Skipped: ${issue.user.type === 'Bot' ? 'an app' : issue.author_association}`);
            }
            // Every form opens with "Before you start" boxes that must be ticked before it can be sent.
            const body = issue.body || '';
            if (/^### Before you start\s*$/m.test(body) && /^- \[x\] /im.test(body)) return core.info('Filed with a form');

            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body:
              "Thanks. Issues here are filed with one of the forms, which ask for what it takes to act on them, and " +
              `this one wasn't, so it's closed. Please file it again with a form: https://github.com/${owner}/${repo}/issues/new/choose` });
            await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'not_planned' });
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['auto-closed'] })
              .catch(e => core.warning(`Couldn't label it: ${e.message}`));
            core.info('Closed: not filed with a form');
  labels:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create accepted --force --color 0e8a16 --description "The maintainer wants this: a pull request for it is welcome"
          gh label create auto-closed --force --color ededed --description "Closed by the contribution gate: its comment says why"
          gh label create needs-triage --force --color fbca04 --description "New from a form: the maintainer hasn't looked yet"
