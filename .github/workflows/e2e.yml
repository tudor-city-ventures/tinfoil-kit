name: e2e
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths: [tools/**, kit.json, kit, 'Open Tinfoil Kit.command', SETUP.command, tests/**, .github/workflows/e2e.yml]
  push:
    branches: [main]
    paths: [tools/**, kit.json, kit, 'Open Tinfoil Kit.command', SETUP.command, tests/**, .github/workflows/e2e.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install gguf numpy libzim playwright && playwright install --with-deps chromium
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: tests/work/downloads
          key: e2e-downloads-${{ hashFiles('tests/build_fixtures.sh') }}
      - run: tests/build_fixtures.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci --ignore-scripts    # axe-core, for the accessibility checks, from package.json
      - run: tests/run_all.sh
        env:
          KIT_AXE: ${{ github.workspace }}/node_modules/axe-core/axe.min.js
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: e2e-logs-and-screenshots
          path: |
            tests/work/logs
            tests/work/shots
            tests/work/FIXTURES.txt
