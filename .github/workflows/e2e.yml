name: e2e
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths: [kit/tools/**, kit/kit.json, kit/kit, 'kit/Open Tinfoil Kit.command', kit/SETUP.command, tests/**,
      .github/workflows/e2e.yml]
  push:
    branches: [main]
    paths: [kit/tools/**, kit/kit.json, kit/kit, 'kit/Open Tinfoil Kit.command', kit/SETUP.command, tests/**,
      .github/workflows/e2e.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install gguf numpy libzim playwright && playwright install --with-deps chromium
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/work/downloads
          key: e2e-downloads-${{ hashFiles('tests/build_fixtures.sh') }}
      - run: tests/build_fixtures.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci --ignore-scripts    # axe-core, for the accessibility checks, from package.json
      # The kit's own program, which the test's kit carries as a release does: ./kit and the launcher run it.
      - run: kit/tools/tinfoilkit/build.sh
      - run: tests/run_all.sh
        env:
          KIT_AXE: ${{ github.workspace }}/node_modules/axe-core/axe.min.js
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-and-screenshots
          path: |
            tests/work/logs
            tests/work/shots
            tests/work/FIXTURES.txt
