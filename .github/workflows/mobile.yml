name: phone app
# The phone app (mobile/): its checks, then a build of each app with a test on an iPhone simulator and an Android
# emulator. GitHub's runners cost nothing for a public repo. Signing and the stores come later, from a workflow of
# their own.
on:
  pull_request:
    paths: ["mobile/**", "site/kit.json", "site/sources.json", "tests/make_zims.py", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", "site/kit.json", "site/sources.json", "tests/make_zims.py", ".github/workflows/mobile.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "1"
  # Maestro runs the tests in mobile/e2e. The SHA-256 is of its release's maestro.zip.
  MAESTRO_VERSION: "2.9.0"
  MAESTRO_SHA256: "855bb2ce1399d82f4f4a73d84a4d945f70b0d43eb86127e027af82809f63f0bd"
  MAESTRO_CLI_NO_ANALYTICS: "1"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # The app's ZIM reader is checked against books libzim makes, as well as its own test books
      - name: Make test books with libzim
        run: &books |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q libzim==4.1.0
          mkdir -p "$RUNNER_TEMP/zim" && cd "$RUNNER_TEMP/zim" && "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tests/make_zims.py"
      - run: npm run check
        env:
          ZIM_FIXTURES: ${{ runner.temp }}/zim

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('mobile/package-lock.json') }}
      - run: npm ci --ignore-scripts
        working-directory: mobile
      # The native project comes from app.json each time (prebuild); the release build carries its JavaScript, signed
      # with the debug key, for the emulator's processor only.
      - name: Build the app
        working-directory: mobile
        env:
          EXPO_PUBLIC_KIWIX_CATALOG: http://localhost:19100/catalog/v2/entries # e2e/kiwix.py stands in for Kiwix
          EXPO_PUBLIC_DOWNLOAD_LOGS: "1" # the downloader logs what it does, for Show what went wrong
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain
      - name: Start an Android emulator
        timeout-minutes: 15
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          img="system-images;android-35;google_apis;x86_64"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          # avdmanager and the emulator look for the emulator's settings in different places unless told one
          export ANDROID_AVD_HOME="$HOME/.android/avd" PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"    # adb, for Maestro
          yes | "$tools/sdkmanager" --install platform-tools emulator "$img" > /dev/null
          echo no | "$tools/avdmanager" create avd -n ci -k "$img" --device pixel_7
          "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator=$!
          until [ "$(adb shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; do
            kill -0 "$emulator" 2> /dev/null || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }    # it stopped
            sleep 5
          done
          adb install mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Install Maestro
        run: &maestro |
          f="$RUNNER_TEMP/maestro.zip"
          curl -fsSL -o "$f" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          sha=$(shasum -a 256 "$f" | cut -d' ' -f1)
          echo "maestro.zip $MAESTRO_VERSION: $sha"
          [ "$sha" = "$MAESTRO_SHA256" ] || { echo "maestro.zip isn't the one pinned"; exit 1; }
          unzip -q "$f" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Make test books with libzim
        run: *books
      - name: Test the app
        run: |
          python3 mobile/e2e/kiwix.py 19100 "$RUNNER_TEMP/zim" > "$RUNNER_TEMP/kiwix.log" 2>&1 &
          adb reverse tcp:19100 tcp:19100    # the emulator's localhost:19100 is the runner's
          maestro test mobile/e2e --test-output-dir e2e-output
      # What was on screen when a test failed, what the app asked of the stand-in Kiwix, and the app's log
      - name: Show what went wrong
        if: failure()
        run: &why |
          echo "== On screen"
          maestro hierarchy 2> /dev/null | python3 -c '
          import json, sys
          s = sys.stdin.read()
          tree, _ = json.JSONDecoder().raw_decode(s[s.index("{"):])
          def walk(n):
              a = n.get("attributes", {})
              t = (a.get("text") or a.get("accessibilityText") or "").strip()
              if t:
                  print(t)
              for c in n.get("children", []):
                  walk(c)
          walk(tree)' || true
          echo "== Asked of the stand-in Kiwix"
          cat "$RUNNER_TEMP/kiwix.log" || true
          echo "== The app's log"
          if command -v xcrun > /dev/null; then
            xcrun simctl spawn booted log show --last 10m --style compact --info --predicate \
              'process == "TinfoilKit" AND (eventMessage CONTAINS "RNBD" OR eventMessage CONTAINS "RNBackgroundDownloader" OR eventMessage CONTAINS[c] "exception")' |
              tail -n 150
            echo "== iOS's downloader"
            xcrun simctl spawn booted log show --last 10m --style compact --predicate \
              'process == "nsurlsessiond" AND eventMessage CONTAINS "tinfoilkit"' | tail -n 50
          else
            adb logcat -d | grep -E "ReactNativeJS|BackgroundDownload|AndroidRuntime" | tail -n 100
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-screens
          path: e2e-output
          if-no-files-found: ignore

  ios:
    needs: check
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --ignore-scripts
        working-directory: mobile
      # A simulator build needs no signing.
      - name: Build the app
        working-directory: mobile
        env:
          EXPO_PUBLIC_KIWIX_CATALOG: http://localhost:19100/catalog/v2/entries # e2e/kiwix.py stands in for Kiwix
          EXPO_PUBLIC_DOWNLOAD_LOGS: "1" # the downloader logs what it does, for Show what went wrong
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios && pod install
          xcodebuild -workspace TinfoilKit.xcworkspace -scheme TinfoilKit -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Start an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          xcrun simctl install "$udid" mobile/ios/build/Build/Products/Release-iphonesimulator/TinfoilKit.app
      - name: Install Maestro
        run: *maestro
      - name: Make test books with libzim
        run: *books
      - name: Test the app
        run: |
          python3 mobile/e2e/kiwix.py 19100 "$RUNNER_TEMP/zim" > "$RUNNER_TEMP/kiwix.log" 2>&1 &
          maestro test mobile/e2e --test-output-dir e2e-output
      - name: Show what went wrong
        if: failure()
        run: *why
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: iphone-screens
          path: e2e-output
          if-no-files-found: ignore
