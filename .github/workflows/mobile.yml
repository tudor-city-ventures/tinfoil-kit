name: phone app
# The phone app (mobile/): its checks, then a build of each app with a test on an iPhone simulator and an Android
# emulator, filmed: the videos job links the videos from the run's page. GitHub's runners cost nothing for a public
# repo. Signing and the stores come later, from a workflow of their own.
on:
  pull_request:
    paths: ["mobile/**", "site/kit.json", "site/sources.json", "tests/make_zims.py", "tests/drive.py", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", "site/kit.json", "site/sources.json", "tests/make_zims.py", "tests/drive.py", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      map_sizes:
        description: "Only measure the phone map's real sizes for a few places, from Protomaps' newest world map"
        type: boolean
        default: false
permissions:
  contents: read
# A push to main never cancels another's run: each tests its own commit. A pull request's newer push does.
concurrency:
  group: mobile-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true
env:
  CI: "1"
  # Maestro runs the tests in mobile/e2e. The SHA-256 is of its release's maestro.zip.
  MAESTRO_VERSION: "2.9.0"
  MAESTRO_SHA256: "855bb2ce1399d82f4f4a73d84a4d945f70b0d43eb86127e027af82809f63f0bd"
  MAESTRO_CLI_NO_ANALYTICS: "1"
jobs:
  check:
    if: ${{ !inputs.map_sizes }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # The app's ZIM reader is checked against books libzim makes, as well as its own test books
      - name: Make test books with libzim
        run: &books |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q libzim==4.1.0
          mkdir -p "$RUNNER_TEMP/zim" && cd "$RUNNER_TEMP/zim" && "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tests/make_zims.py"
      - run: npm run check
        env:
          ZIM_FIXTURES: ${{ runner.temp }}/zim
      # The Android build's Java: the runner's own is newer than its Kotlin knows
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      # A minute, where the Android build below takes 13 to find a mistake in its Kotlin
      - run: npm run check:android

  map-sizes:
    if: ${{ inputs.map_sizes }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx jest src/kit/protomaps.test.ts
        env:
          MAP_SIZES: "1"

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      # Most changes are to the app's JavaScript alone: then the last build of the same native code is reused, with
      # the new JavaScript in it. The key names everything the native build is made from (bump its number when the
      # build's commands change), and the files the JavaScript uses, which Android keeps with its own resources.
      - name: Reuse the last build, if its native code is the same
        id: app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/debug.keystore
          key: android-app-1-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/assets/**', 'mobile/modules/*/android/**', 'mobile/modules/*/expo-module.config.json', 'mobile/src/**', '!mobile/src/**/*.ts', '!mobile/src/**/*.tsx') }}
      # A new package or library starts from the last run's downloads, so a build asks Maven Central only for what's
      # new: it answers too many questions from GitHub's machines with 429
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.app.outputs.cache-hit != 'true'
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('mobile/package-lock.json', 'mobile/modules/*/android/build.gradle') }}
          restore-keys: gradle-
      - run: npm ci --ignore-scripts
        working-directory: mobile
      # The native project comes from app.json each time (prebuild); the release build carries its JavaScript, signed
      # with the debug key, for the emulator's processor only.
      - name: Build the app
        if: steps.app.outputs.cache-hit != 'true'
        working-directory: mobile
        env: &internet # e2e/internet.py stands in for Kiwix and Protomaps
          EXPO_PUBLIC_KIWIX_CATALOG: http://localhost:19100/catalog/v2/entries
          EXPO_PUBLIC_PROTOMAPS_BUILDS: http://localhost:19100/protomaps/builds.json
          EXPO_PUBLIC_PROTOMAPS_BUILD_BASE: http://localhost:19100/protomaps
          EXPO_PUBLIC_BASEMAPS_ASSETS: http://localhost:19100/assets
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain \
            -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=10000
      # Saved now, not when the job ends, so a failing test doesn't cost the next run its build
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.app.outputs.cache-hit != 'true'
        with:
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/debug.keystore
          key: ${{ steps.app.outputs.cache-primary-key }}
      # As the build does it: the bundle without minifying, compiled by the Hermes compiler Gradle uses, then the app
      # aligned and signed again with the same debug key
      - name: Put the new JavaScript in the app
        if: steps.app.outputs.cache-hit == 'true'
        working-directory: mobile
        env: *internet
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          w="$RUNNER_TEMP/js" && mkdir -p "$w/assets"
          npx expo export:embed --platform android --dev false --minify false --reset-cache \
            --bundle-output "$w/index.android.js" --assets-dest "$w/res"
          node_modules/hermes-compiler/hermesc/linux64-bin/hermesc -emit-binary -O \
            -out "$w/assets/index.android.bundle" "$w/index.android.js"
          cp "$apk" "$w/app.apk"
          (cd "$w" && zip -q -0 app.apk assets/index.android.bundle)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$tools/zipalign" -f -p 4 "$w/app.apk" "$w/aligned.apk"
          "$tools/apksigner" sign --ks android/app/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out "$apk" "$w/aligned.apk"
      - name: Start an Android emulator
        timeout-minutes: 15
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          img="system-images;android-35;google_apis;x86_64"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          # avdmanager and the emulator look for the emulator's settings in different places unless told one
          export ANDROID_AVD_HOME="$HOME/.android/avd" PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"    # adb, for Maestro
          yes | "$tools/sdkmanager" --install platform-tools emulator "$img" > /dev/null
          echo no | "$tools/avdmanager" create avd -n ci -k "$img" --device pixel_7
          "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator=$!
          until [ "$(adb shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; do
            kill -0 "$emulator" 2> /dev/null || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }    # it stopped
            sleep 5
          done
          adb install mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Install Maestro
        run: &maestro |
          f="$RUNNER_TEMP/maestro.zip"
          curl -fsSL -o "$f" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          sha=$(shasum -a 256 "$f" | cut -d' ' -f1)
          echo "maestro.zip $MAESTRO_VERSION: $sha"
          [ "$sha" = "$MAESTRO_SHA256" ] || { echo "maestro.zip isn't the one pinned"; exit 1; }
          unzip -q "$f" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Make test books with libzim
        run: *books
      # A few MB of Protomaps' newest world map, so the test's map is a real one
      - name: Make a piece of the world map
        working-directory: mobile
        run: &map E2E_MAP="$RUNNER_TEMP/protomaps" npx jest src/kit/protomaps.test.ts
      # Filmed, for the videos job, captioned with the labels of the test's steps
      - name: Test the app
        run: |
          python3 mobile/e2e/internet.py 19100 "$RUNNER_TEMP/zim" "$RUNNER_TEMP/protomaps" > "$RUNNER_TEMP/internet.log" 2>&1 &
          adb reverse tcp:19100 tcp:19100    # the emulator's localhost:19100 is the runner's
          adb forward tcp:8000 tcp:8000      # and the runner's localhost:8000 the emulator's: the phone, shared
          python3 tests/drive.py record android -- maestro test mobile/e2e --test-output-dir e2e-output
      # What was on screen when a test failed, what the app asked of the stand-in internet, and the app's log
      - name: Show what went wrong
        if: failure()
        run: &why |
          echo "== Asked of the stand-in internet, lately"
          tail -n 150 "$RUNNER_TEMP/internet.log" || true
          echo "== The app's log"
          if command -v xcrun > /dev/null; then
            logs() { xcrun simctl spawn booted log show --last 10m --style compact --info --predicate "$1" | tail -n "$2"; }
            logs 'process == "TinfoilKit" AND (subsystem == "com.tinfoilkit.app" OR eventMessage CONTAINS[c] "exception")' 60
            echo "== The app's networking errors"
            logs 'process == "TinfoilKit" AND subsystem == "com.apple.CFNetwork" AND (messageType == error OR messageType == fault)' 30
            echo "== iOS's downloader, on this app and its errors"
            logs 'process == "nsurlsessiond" AND (eventMessage CONTAINS[c] "tinfoil" OR messageType == error OR messageType == fault)' 80
            echo "== Crash reports"
            ls -t ~/Library/Logs/DiagnosticReports 2> /dev/null | head -n 5 || true
          else
            adb shell pm list packages com.tinfoilkit.app || true
            adb logcat -d -b crash | tail -n 60
            adb logcat -d | grep -E "ReactNativeJS|KitBooks|DownloadManager|AndroidRuntime|tinfoilkit|chromium" | tail -n 100
          fi
          # Last, so the end of the job's log has them
          echo "== The last steps, and the one that failed"    # from Maestro's reports of each flow (commands.json)
          find e2e-output ~/.maestro/tests -name 'commands*.json' -exec python3 -c '
          import json, sys
          steps = [(c.get("metadata") or c, c.get("command")) for c in json.load(open(sys.argv[1]))]
          done = [i for i, (m, _) in enumerate(steps) if m.get("status")]
          end = next((i for i in done if steps[i][0]["status"] == "FAILED"), done[-1] if done else 0)
          for m, command in steps[max(0, end - 8) : end + 1]:
              print(m.get("status"), json.dumps(command)[:300])
              if m.get("status") == "FAILED":  # dict(): find puts the file name in place of every empty pair of braces
                  print((m.get("error") or dict()).get("message"))' {} \; || true
          echo "== On screen"
          maestro hierarchy 2> /dev/null | python3 -c '
          import json, sys
          s = sys.stdin.read()
          tree, _ = json.JSONDecoder().raw_decode(s[s.index("{"):])
          def walk(n):
              a = n.get("attributes", {})
              t = (a.get("text") or a.get("accessibilityText") or "").strip()
              if t:
                  print(t)
              for c in n.get("children", []):
                  walk(c)
          walk(tree)' || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-screens
          path: e2e-output
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: raw-video-android
          path: tests/work/video
          retention-days: 1
          if-no-files-found: ignore

  ios:
    needs: check
    runs-on: macos-26
    timeout-minutes: 75 # a full build takes about 30 minutes, less once its compiled files are kept
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      # A first boot takes minutes: it goes on while the app builds
      - name: Start an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Reuse the last build, if its native code is the same
        id: app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            mobile/ios/build/Build/Products/Release-iphonesimulator/TinfoilKit.app
            mobile/ios/build/hermesc
          key: ios-app-5-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/assets/**', 'mobile/modules/*/ios/**', 'mobile/modules/*/expo-module.config.json') }}
      # npm ci takes 5 minutes on a Mac. The same lock file installs the same packages, so they're kept, as npm ci left
      # them: saved before the build adds its own files to them.
      - name: Reuse the packages, if the lock file is the same
        id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mobile/node_modules
          key: ios-modules-1-${{ runner.arch }}-${{ hashFiles('mobile/package-lock.json') }}
      - run: npm ci --ignore-scripts
        if: steps.modules.outputs.cache-hit != 'true'
        working-directory: mobile
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.modules.outputs.cache-hit != 'true'
        with:
          path: mobile/node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      # Most of a full build is compiling the same libraries as the last one. ccache keeps what each of their files
      # compiled to, so a build whose packages are the same compiles only what changed. React Native keeps the builds
      # of itself that pod install downloads beside it.
      - name: Reuse what the last full build compiled and downloaded
        id: compiled
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/ccache
            ~/Library/Caches/ReactNative
          key: ios-compiled-1-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: ios-compiled-1-
      # Signed to run locally, as Xcode signs for the simulator: that puts the app's entitlements in its program, and
      # iOS's downloader takes background downloads only from an app with them (built unsigned, it refuses the app's
      # connection). Built for the simulator on this Mac's processor alone, without an index or separate debug symbols,
      # which a test doesn't use. ccache stands in front of the compiler through wrappers that name both by their paths,
      # with React Native's settings for it in its own config file: React Native's switch for it (USE_CCACHE) ran
      # nothing through it, as its wrapper needs a variable Xcode doesn't pass on. The Hermes compiler the build used is
      # kept with the app, for the next run's new JavaScript. The build's own log is too long to read: the job's gets
      # its errors, and where the time went.
      - name: Build the app
        if: steps.app.outputs.cache-hit != 'true'
        working-directory: mobile
        env: *internet
        run: |
          command -v ccache > /dev/null || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet ccache
          ccache --set-config sloppiness=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          ccache --set-config depend_mode=true
          ccache --set-config file_clone=true
          ccache --set-config inode_cache=true
          ccache --zero-stats > /dev/null
          for c in clang clang++; do
            printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$(command -v ccache)" "$(xcrun --find "$c")" > "$RUNNER_TEMP/ccache-$c"
            chmod +x "$RUNNER_TEMP/ccache-$c"
          done
          time npx expo prebuild --platform ios --no-install
          cd ios && time pod install
          log="$RUNNER_TEMP/xcodebuild.log"
          time xcodebuild -workspace TinfoilKit.xcworkspace -scheme TinfoilKit -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build ARCHS=arm64 \
            COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf \
            CC="$RUNNER_TEMP/ccache-clang" CXX="$RUNNER_TEMP/ccache-clang++" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= -showBuildTimingSummary build > "$log" 2>&1 ||
            { grep -E -A 3 '(^| )error: ' "$log" | head -n 200; tail -n 40 "$log"; exit 1; }
          sed -n '/Build Timing Summary/,$p' "$log" | grep -v '^note: ' || true
          echo "Steps by target:" && grep -o "(in target '[^']*'" "$log" | sort | uniq -c | sort -rn | head -n 25
          echo "ccache:" && ccache --show-stats --verbose | head -n 40
          codesign --display --entitlements - "build/Build/Products/Release-iphonesimulator/TinfoilKit.app" 2>&1 | tail -n 20
          cp "$(ls Pods/hermes-engine/destroot/bin/hermesc 2> /dev/null || echo ../node_modules/hermes-compiler/hermesc/osx-bin/hermesc)" build/hermesc
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.app.outputs.cache-hit != 'true'
        with:
          path: |
            mobile/ios/build/Build/Products/Release-iphonesimulator/TinfoilKit.app
            mobile/ios/build/hermesc
          key: ${{ steps.app.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.app.outputs.cache-hit != 'true' && steps.compiled.outputs.cache-hit != 'true'
        with:
          path: |
            ~/Library/Caches/ccache
            ~/Library/Caches/ReactNative
          key: ${{ steps.compiled.outputs.cache-primary-key }}
      - name: Put the new JavaScript in the app
        if: steps.app.outputs.cache-hit == 'true'
        working-directory: mobile
        env: *internet
        run: |
          app=ios/build/Build/Products/Release-iphonesimulator/TinfoilKit.app
          rm -rf "$app/assets"
          npx expo export:embed --platform ios --dev false --minify false --reset-cache \
            --bundle-output "$RUNNER_TEMP/main.js" --assets-dest "$app"
          ios/build/hermesc -emit-binary -O -out "$app/main.jsbundle" "$RUNNER_TEMP/main.js"
      # Signed again for its new JavaScript; its entitlements stay in its program
      - name: Sign the app
        if: steps.app.outputs.cache-hit == 'true'
        working-directory: mobile/ios/build/Build/Products/Release-iphonesimulator
        run: codesign --force --sign - --timestamp=none TinfoilKit.app
      - name: Put the app on the simulator
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" mobile/ios/build/Build/Products/Release-iphonesimulator/TinfoilKit.app
      - name: Install Maestro
        run: *maestro
      - name: Make test books with libzim
        run: *books
      - name: Make a piece of the world map
        working-directory: mobile
        run: *map
      - name: Test the app
        run: |
          python3 mobile/e2e/internet.py 19100 "$RUNNER_TEMP/zim" "$RUNNER_TEMP/protomaps" > "$RUNNER_TEMP/internet.log" 2>&1 &
          python3 tests/drive.py record iphone -- maestro test mobile/e2e --test-output-dir e2e-output
      - name: Show what went wrong
        if: failure()
        run: *why
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: iphone-screens
          path: e2e-output
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: raw-video-iphone
          path: tests/work/video
          retention-days: 1
          if-no-files-found: ignore

  videos: # the test's recordings as captioned MP4s, each a link on the run's page that downloads it
    needs: [android, ios]
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.android.result == 'failure' || needs.ios.result == 'success' || needs.ios.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: raw-video-*
          path: tests/work/video
          merge-multiple: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core tesseract-ocr > /dev/null
      - run: python3 tests/drive.py videos tests/work/video
      # One file each, not zipped (archive: false), so the link on the run's page downloads the video itself.
      - id: iphone
        if: hashFiles('tests/work/video/iphone.mp4') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: tests/work/video/iphone.mp4
          archive: false
          retention-days: 7
          overwrite: true
      - id: android
        if: hashFiles('tests/work/video/android.mp4') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: tests/work/video/android.mp4
          archive: false
          retention-days: 7
          overwrite: true
      - name: List the videos on the run's page
        env:
          IPHONE: ${{ steps.iphone.outputs.artifact-url }}
          ANDROID: ${{ steps.android.outputs.artifact-url }}
        run: python3 tests/drive.py summary "iphone=$IPHONE" "android=$ANDROID" >> "$GITHUB_STEP_SUMMARY"
