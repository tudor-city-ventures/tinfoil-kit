name: phone app
# The phone app (mobile/): its checks, then a build of each app with a test on an iPhone simulator and an Android
# emulator. GitHub's runners cost nothing for a public repo. Signing and the stores come later, from a workflow of
# their own.
on:
  pull_request:
    paths: ["mobile/**", "site/kit.json", "site/sources.json", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", "site/kit.json", "site/sources.json", ".github/workflows/mobile.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "1"
  # Maestro runs the tests in mobile/e2e. The SHA-256 is of its release's maestro.zip.
  MAESTRO_VERSION: "2.9.0"
  MAESTRO_SHA256: ""
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('mobile/package-lock.json') }}
      - run: npm ci --ignore-scripts
        working-directory: mobile
      # The native project comes from app.json each time (prebuild); the release build carries its JavaScript, signed
      # with the debug key, for the emulator's processor only.
      - name: Build the app
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain
      - name: Start an Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          img="system-images;android-35;google_apis;x86_64"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --install emulator "$img" > /dev/null
          echo no | "$tools/avdmanager" create avd -n ci -k "$img" --device pixel_7
          "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect &
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do sleep 5; done
          adb install mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Install Maestro
        run: &maestro |
          f="$RUNNER_TEMP/maestro.zip"
          curl -fsSL -o "$f" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          sha=$(shasum -a 256 "$f" | cut -d' ' -f1)
          echo "maestro.zip $MAESTRO_VERSION: $sha"
          [ -z "$MAESTRO_SHA256" ] || [ "$sha" = "$MAESTRO_SHA256" ] || { echo "maestro.zip isn't the one pinned"; exit 1; }
          unzip -q "$f" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Test the app
        run: maestro test mobile/e2e --test-output-dir e2e-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-screens
          path: e2e-output
          if-no-files-found: ignore

  ios:
    needs: check
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --ignore-scripts
        working-directory: mobile
      # A simulator build needs no signing.
      - name: Build the app
        working-directory: mobile
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios && pod install
          xcodebuild -workspace TinfoilKit.xcworkspace -scheme TinfoilKit -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Start an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          xcrun simctl install "$udid" mobile/ios/build/Build/Products/Release-iphonesimulator/TinfoilKit.app
      - name: Install Maestro
        run: *maestro
      - name: Test the app
        run: maestro test mobile/e2e --test-output-dir e2e-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: iphone-screens
          path: e2e-output
          if-no-files-found: ignore
