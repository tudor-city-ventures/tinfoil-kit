name: build regions (temporary, branch only)
on:
  push:
    branches: [claude/project-thread-0smmv8]
    paths: [site/build_regions.py, .github/workflows/regions-tmp.yml, .github/probe/probe.py]
permissions:
  contents: read
jobs:
  regions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 .github/probe/probe.py
