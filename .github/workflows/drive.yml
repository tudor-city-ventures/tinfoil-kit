name: drive test
# The kit on a real exFAT disk: set up on a Mac, then plugged into Windows and Linux (tests/drive_test.sh). And set
# up on Windows from a download, onto the PC and onto a drive (tests/drive_windows.ps1).
# By hand (Actions > drive test > Run workflow) once the bulk of a change is done. Nightly and on pushes only when
# something it covers changed (the changes job), so site edits never start it; but Monday's nightly always runs,
# since llama.cpp and kiwix-tools put out new builds (which the kit gets) with no change here. Pushes start it only
# once the repo is public, since Mac minutes cost money while it's private.
run-name: drive test${{ inputs.only == 'windows-setup' && ', Windows setup only' || '' }}
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Run just one part (windows-setup skips the Mac, so it costs no Mac minutes)
        type: choice
        options: [all, windows-setup]
        default: all
  push:
    branches: [main]
concurrency:    # runs by hand never cancel each other (each is someone's check); a newer nightly or push run replaces an older one
  group: drive-${{ github.ref }}-${{ github.event_name }}${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:    # did a file the drive test covers change since the push before, or since the last green run?
    if: github.event_name != 'push' || !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read    # to find the last green run
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            push) base="$BEFORE" ;;
            schedule)
              if [ "$(date -u +%u)" = 1 ]; then
                base="" && echo "Monday: it runs anyway, on the newest llama.cpp and kiwix-tools builds."
              else
                base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/drive.yml/runs?status=success&per_page=30" \
                          -q '[.workflow_runs[] | select(.display_title | contains("only") | not)][0].head_sha')" || base=""
              fi ;;
            *) base="" ;;    # by hand: always
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2> /dev/null &&
             git diff --quiet "$base" HEAD -- tools kit kit.json SETUP.command 'Open Tinfoil Kit.command' UNINSTALL.command '*.bat' \
               'tests/drive*' 'tests/make_*.py' tests/build_fixtures.sh tests/env.sh tests/mock_remote.py tests/ui_test.py \
               .github/workflows/drive.yml \
               ':(exclude)tools/pins.json'    # the test's kits take the mock's own builds, never the pinned ones
          then
            echo "Nothing the drive test covers changed since $base, so it doesn't run."
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

  fixtures:
    needs: changes
    if: needs.changes.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install gguf numpy libzim
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: tests/work/downloads
          key: drive-downloads-${{ hashFiles('tests/build_fixtures.sh') }}
      - run: tests/build_fixtures.sh drive
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mock-internet
          path: tests/work/remote
          retention-days: 1

  mac:
    needs: fixtures
    if: inputs.only != 'windows-setup'
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      drive: ${{ steps.made.outputs.drive }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install webkit
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: mock-internet
          path: tests/work/remote
      - run: tests/drive_test.sh mac
      - id: made
        if: ${{ !cancelled() }}
        run: if [ -f tests/work/drive.vhd ]; then echo "drive=yes" >> "$GITHUB_OUTPUT"; fi
      - if: ${{ !cancelled() && steps.made.outputs.drive == 'yes' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: drive
          path: tests/work/drive.vhd
          retention-days: 1
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mac-logs-and-screenshots
          path: |
            tests/work/logs
            tests/work/shots

  windows:
    needs: mac
    if: ${{ !cancelled() && needs.mac.outputs.drive == 'yes' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install playwright
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: drive
          path: tests/work
      - name: Plug in the drive the Mac made and double-click Open Tinfoil Kit for Windows.bat
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests/work/logs, tests/work/shots | Out-Null
          $disk = Mount-DiskImage -ImagePath (Resolve-Path tests/work/drive.vhd) -PassThru | Get-Disk
          $part = Get-Partition -DiskNumber $disk.Number | Where-Object { (Get-Volume -Partition $_ -ErrorAction SilentlyContinue).FileSystem -eq 'exFAT' } | Select-Object -First 1
          if (-not $part) { Get-Partition -DiskNumber $disk.Number | Format-List; throw "no exFAT partition on the drive" }
          if (-not $part.DriveLetter) {
            $part | Add-PartitionAccessPath -AssignDriveLetter
            $part = Get-Partition -DiskNumber $disk.Number -PartitionNumber $part.PartitionNumber
          }
          $kit = "$($part.DriveLetter):\TinfoilKit"
          "The drive is $($part.DriveLetter):"
          Get-ChildItem -Force "$kit\library", "$kit\models" -Recurse | ForEach-Object { "$($_.Mode)  $($_.FullName)" }
          Start-Process -FilePath "$kit\Open Tinfoil Kit for Windows.bat" -WorkingDirectory $kit
          python tests/drive.py check 8888 8080
          $checked = $LASTEXITCODE
          Start-Sleep 5
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("tests/work/shots/windows-desktop.png")
          } catch { "(no desktop screenshot here: $_)" }
          $env:KIT_BROWSER = "msedge"; $env:KIT_LIBRARY_PORT = "8888"; $env:KIT_AI_PORT = "8080"
          $env:KIT_TEST_SHOTS = "tests/work/shots/windows"
          python tests/ui_test.py
          if ($checked -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-screenshots
          path: tests/work/shots

  windows-setup:
    needs: fixtures
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: mock-internet
          path: tests/work/remote
      - name: Unzip the kit in Downloads, double-click SETUP-Windows.bat, Open Tinfoil Kit for Windows.bat, UNINSTALL-Windows.bat
        shell: pwsh
        run: tests/drive_windows.ps1
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-setup-logs
          path: tests/work/logs

  linux:
    needs: mac
    if: ${{ !cancelled() && needs.mac.outputs.drive == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: drive
          path: tests/work
      - run: tests/drive_test.sh linux
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: linux-logs
          path: tests/work/logs
