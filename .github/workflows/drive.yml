name: drive test
# The kit on a real exFAT disk: set up on a Mac, then plugged into Windows and Linux (tests/drive_test.sh). And set
# up on Windows from a download, onto the PC and onto a drive (tests/drive_windows.ps1). Each machine's screen is
# filmed (tests/drive.py record), and the videos job links the videos from the run's page, for anyone checking how
# the kit looks on a system they don't have.
# By hand (Actions > drive test > Run workflow) once the bulk of a change is done. Nightly and on pushes only when
# something it covers changed (the changes job), so site edits never start it; but Monday's nightly always runs,
# since llama.cpp and kiwix-tools put out new builds (which the kit gets) with no change here. Pushes start it only
# once the repo is public, since Mac minutes cost money while it's private.
run-name: drive test${{ inputs.only == 'windows-setup' && ', Windows setup only' || '' }}
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Run just one part (windows-setup skips the Mac, so it costs no Mac minutes)
        type: choice
        options: [all, windows-setup]
        default: all
  push:
    branches: [main]
concurrency:    # runs by hand never cancel each other (each is someone's check); a newer nightly or push run replaces an older one
  group: drive-${{ github.ref }}-${{ github.event_name }}${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:    # did a file the drive test covers change since the push before, or since the last green run?
    if: github.event_name != 'push' || !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read    # to find the last green run
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            push) base="$BEFORE" ;;
            schedule)
              if [ "$(date -u +%u)" = 1 ]; then
                base="" && echo "Monday: it runs anyway, on the newest llama.cpp and kiwix-tools builds."
              else
                base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/drive.yml/runs?status=success&per_page=30" \
                          -q '[.workflow_runs[] | select(.display_title | contains("only") | not)][0].head_sha')" || base=""
              fi ;;
            *) base="" ;;    # by hand: always
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2> /dev/null &&
             git diff --quiet "$base" HEAD -- tools kit kit.json SETUP.command START-HERE.command UNINSTALL.command '*.bat' \
               'tests/drive*' 'tests/make_*.py' tests/build_fixtures.sh tests/env.sh tests/mock_remote.py tests/ui_test.py \
               .github/workflows/drive.yml \
               ':(exclude)tools/pins.json'    # the test's kits take the mock's own builds, never the pinned ones
          then
            echo "Nothing the drive test covers changed since $base, so it doesn't run."
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

  fixtures:
    needs: changes
    if: needs.changes.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install gguf numpy libzim
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: tests/work/downloads
          key: drive-downloads-${{ hashFiles('tests/build_fixtures.sh') }}
      - run: tests/build_fixtures.sh drive
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mock-internet
          path: tests/work/remote
          retention-days: 1

  mac:
    needs: fixtures
    if: inputs.only != 'windows-setup'
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      drive: ${{ steps.made.outputs.drive }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install webkit
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: mock-internet
          path: tests/work/remote
      - name: Set up the drive, start the kit, use the page; then a home server, and uninstall (filmed)
        run: python3 tests/drive.py record mac -- tests/drive_test.sh mac
      - id: made
        if: ${{ !cancelled() }}
        run: if [ -f tests/work/drive.vhd ]; then echo "drive=yes" >> "$GITHUB_OUTPUT"; fi
      - if: ${{ !cancelled() && steps.made.outputs.drive == 'yes' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: drive
          path: tests/work/drive.vhd
          retention-days: 1
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mac-logs-and-screenshots
          path: |
            tests/work/logs
            tests/work/shots
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: raw-video-mac
          path: tests/work/video
          retention-days: 1
          overwrite: true

  windows:
    needs: mac
    if: ${{ !cancelled() && needs.mac.outputs.drive == 'yes' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          choco install ffmpeg -y --no-progress | Out-Null
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: drive
          path: tests/work
      - name: Plug in the drive the Mac made, double-click START-HERE-Windows.bat, use the page in Edge (filmed)
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1280 -Height 800 -Force } catch { "(the screen stays at its size: $_)" }
          python tests/drive.py record windows -- pwsh -NoProfile -File tests/drive_windows.ps1 -Drive
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-screenshots
          path: tests/work/shots
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: raw-video-windows
          path: tests/work/video
          retention-days: 1
          overwrite: true

  windows-setup:
    needs: fixtures
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: |
          pip install pywinpty
          choco install ffmpeg -y --no-progress | Out-Null
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: mock-internet
          path: tests/work/remote
      - name: Unzip the kit in Downloads, double-click SETUP-Windows.bat, START-HERE-Windows.bat, UNINSTALL-Windows.bat (filmed)
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1280 -Height 800 -Force } catch { "(the screen stays at its size: $_)" }
          python tests/drive.py record windows-setup -- pwsh -NoProfile -File tests/drive_windows.ps1
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-setup-logs
          path: tests/work/logs
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: raw-video-windows-setup
          path: tests/work/video
          retention-days: 1
          overwrite: true

  linux:
    needs: mac
    if: ${{ !cancelled() && needs.mac.outputs.drive == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xterm > /dev/null
          pip install playwright
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: drive
          path: tests/work
      - name: Plug in the drive, start the kit on Ubuntu and four more, use the page in Chrome; a home server, uninstall (filmed)
        run: python3 tests/drive.py record linux -- tests/drive_test.sh linux
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: linux-logs
          path: |
            tests/work/logs
            tests/work/shots
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: raw-video-linux
          path: tests/work/video
          retention-days: 1
          overwrite: true

  videos:    # the recordings as captioned MP4s, each a link on the run's page that downloads it
    needs: [changes, mac, windows, windows-setup, linux]
    if: ${{ !cancelled() && needs.changes.outputs.run == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: raw-video-*
          path: tests/work/video
          merge-multiple: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
      - run: python3 tests/drive.py videos tests/work/video
      # One file each, not zipped (archive: false), so the link on the run's page downloads the video itself.
      - id: mac
        if: hashFiles('tests/work/video/mac.mp4') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: tests/work/video/mac.mp4
          archive: false
          retention-days: 7
          overwrite: true
      - id: windows
        if: hashFiles('tests/work/video/windows.mp4') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: tests/work/video/windows.mp4
          archive: false
          retention-days: 7
          overwrite: true
      - id: windows-setup
        if: hashFiles('tests/work/video/windows-setup.mp4') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: tests/work/video/windows-setup.mp4
          archive: false
          retention-days: 7
          overwrite: true
      - id: linux
        if: hashFiles('tests/work/video/linux.mp4') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: tests/work/video/linux.mp4
          archive: false
          retention-days: 7
          overwrite: true
      - name: List the videos on the run's page
        env:
          MAC: ${{ steps.mac.outputs.artifact-url }}
          WINDOWS: ${{ steps.windows.outputs.artifact-url }}
          WINDOWS_SETUP: ${{ steps.windows-setup.outputs.artifact-url }}
          LINUX: ${{ steps.linux.outputs.artifact-url }}
        run: |
          python3 tests/drive.py summary "mac=$MAC" "windows=$WINDOWS" "windows-setup=$WINDOWS_SETUP" "linux=$LINUX" \
            >> "$GITHUB_STEP_SUMMARY"
