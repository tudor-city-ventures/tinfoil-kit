name: scorecard
# OpenSSF Scorecard grades how this repo is run (pinned actions, token permissions, branch rules, signed
# releases) and publishes the result at scorecard.dev and on the Security tab. It needs a public repo.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write    # to show the results on the Security tab
      id-token: write           # to publish them to scorecard.dev, which checks they came from this workflow
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif
