# Keeps the workflows' pinned actions current: at most one pull request a week, for all of them together.
# A release has to be out a week before it's proposed, so a hijacked one is usually caught first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Actions"
