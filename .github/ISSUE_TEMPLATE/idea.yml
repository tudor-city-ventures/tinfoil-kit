name: Idea or change
description: Something to add or change, including a new library, map or model source, or a fix to the website or the guide
labels: [enhancement, needs-triage]
body:
  - type: checkboxes
    id: first
    attributes:
      label: Before you start
      description: If the maintainer wants it, they'll label this issue `accepted`. Wait for that before you open a pull request; others are closed automatically.
      options:
        - label: I searched the open and closed issues, and this isn't one of them.
          required: true
        - label: I read [CONTRIBUTING](https://github.com/tudor-city-ventures/tinfoil-kit/blob/main/.github/CONTRIBUTING.md).
          required: true
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: What should change, and why it matters when the internet is down.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: For a library source, its exact name from `./kit search WORDS` and its rough size. For the website or the guide, the page and the fix. Links and anything else that helps.
  - type: dropdown
    id: pr
    attributes:
      label: Will you send the pull request?
      options:
        - Yes, once it's accepted
        - No, I'm suggesting it
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI use
      description: Did an AI tool write any of this?
      options:
        - "No"
        - Yes, and I checked every word
    validations:
      required: true
