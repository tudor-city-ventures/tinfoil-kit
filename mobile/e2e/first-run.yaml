# The first screen, the try-it kit, Get more, the map, Ask and reading a book, on a fresh install: CI runs it on an
# iPhone simulator and an Android emulator (.github/workflows/mobile.yml), with e2e/internet.py standing in for Kiwix,
# serving the test books tests/make_zims.py makes, and for Protomaps, serving a piece of the real world map around
# Huntsville.
# Locally: install the app afresh, then maestro test mobile/e2e. CI installs it just before; clearState would
# reinstall it on iOS, under another folder name.
appId: com.tinfoilkit.app
---
- launchApp
- assertVisible: "Tinfoil Kit"
- assertVisible: "Field medicine books"
- takeScreenshot: 1-first-screen
- tapOn: "Get the try-it kit"
- assertVisible: "On this phone"
- takeScreenshot: 2-library
# Every book downloads in the background, is checked and moves to On this phone
- extendedWaitUntil:
    notVisible: "Downloading"
    timeout: 120000
- assertNotVisible: "Nothing yet"
- takeScreenshot: 3-downloaded
- tapOn: "Get more"
- assertVisible: "Use mobile data"
- takeScreenshot: 4-get-more
# The map of where you live: picked from the kit's places, cut from the world map on the phone, then drawn
- tapOn: "Map"
- assertVisible: "Where do you live.*"
- takeScreenshot: 5-places
- tapOn:
    id: "place-us/alabama"
- extendedWaitUntil:
    visible: "Map of Alabama"
    timeout: 120000
- takeScreenshot: 6-map
# Ask: Search finds the best passages in the books on this phone, and one opens its page, read from the book's file
- tapOn: "Ask"
- tapOn:
    id: "ask-question"
- inputText: "What are the signs of dehydration?"
- tapOn:
    id: "ask-search"
- extendedWaitUntil:
    visible: "Best passages from your library"
    timeout: 30000
- assertVisible: ".*dark urine.*"
- takeScreenshot: 7-ask
- tapOn:
    id: "passage-0"
- extendedWaitUntil:
    visible: ".*Oral rehydration solution.*"
    timeout: 30000
- takeScreenshot: 8-reading
# The book's home page
- tapOn:
    id: "book-home"
- extendedWaitUntil:
    visible: "When to seek urgent help"
    timeout: 30000
# Search finds pages by title, and Back returns to the page before
- tapOn:
    id: "search-book"
- inputText: "Dehy"
# by its id: the keyboard suggests "Dehydration" too
- tapOn:
    id: "found-Dehydration"
- extendedWaitUntil:
    visible: ".*Oral rehydration solution.*"
    timeout: 30000
- takeScreenshot: 9-found
- tapOn:
    id: "book-back"
- extendedWaitUntil:
    visible: "When to seek urgent help"
    timeout: 30000
