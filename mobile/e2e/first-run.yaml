# The first screen, the try-it kit, the map, Get more, copying a book and a map from a kit at home, Ask, reading a
# book and sharing with a phone, on a fresh install: CI runs it on an iPhone simulator and an Android emulator
# (.github/workflows/mobile.yml), with e2e/internet.py standing in for Kiwix, serving the test books tests/make_zims.py
# makes, for Protomaps, serving a piece of the real world map around Huntsville, and for the kit at home.
# Locally: install the app afresh, then maestro test mobile/e2e. CI installs it just before; clearState would
# reinstall it on iOS, under another folder name. CI films each run: a label is what the video's caption says from
# that step on (tests/drive.py record).
appId: com.tinfoilkit.app
---
- launchApp:
    label: "A fresh install: the first screen"
- assertVisible: "Tinfoil Kit"
- assertVisible: "Field medicine books"
- takeScreenshot: 1-first-screen
- tapOn:
    text: "Get the try-it kit"
    label: "The try-it kit downloads and is checked"
- assertVisible: "On this phone"
- takeScreenshot: 2-library
# Every book downloads in the background, is checked and moves to On this phone
- extendedWaitUntil:
    notVisible: "Downloading"
    timeout: 120000
- assertNotVisible: "Nothing yet"
- takeScreenshot: 3-downloaded
# The map of where you live: picked from the kit's places, cut from the world map on the phone, then drawn
- tapOn:
    text: "Map"
    label: "Map: pick where you live"
- assertVisible: "Where do you live.*"
- takeScreenshot: 4-places
- tapOn:
    id: "place-us/alabama"
    label: "Alabama's map downloads, then draws"
- extendedWaitUntil:
    visible: "Map of Alabama"
    timeout: 120000
- takeScreenshot: 5-map
- tapOn:
    text: "Get more"
    label: "Get more: no mobile data unless you allow it"
# A tab tapped as the map draws can go unnoticed on iOS: then it's tapped again
- runFlow:
    when:
      notVisible: "Use mobile data"
    commands:
      - tapOn: "Get more"
- assertVisible: "Use mobile data"
- takeScreenshot: 6-get-more
# A kit at home, typed in (the emulator can't see the Wi-Fi's Bonjour), let in with its code: a book copied from it,
# and its map, which is from a newer world map than the phone's
- tapOn:
    id: "kit-at-home"
    label: "Kit at home: a kit on the home network"
- tapOn:
    text: "Allow" # iOS asks to find devices on the local network, where it shows the question
    optional: true
- tapOn:
    id: "kit-type"
- tapOn:
    id: "kit-address"
- inputText: "localhost:19100"
- tapOn: "Address" # puts the keyboard away
- tapOn:
    id: "kit-code"
    label: "Let in with the kit's 8-digit code"
- inputText: "48217736"
- tapOn: "Access code"
- tapOn:
    id: "kit-connect"
- extendedWaitUntil:
    visible: "Its books"
    timeout: 30000
- assertVisible: "Newer than this phone's"
- takeScreenshot: 7-kit-at-home
- tapOn:
    id: "copy-get-ready.gov_en_all"
    label: "Copy a book and a newer map from the kit"
- tapOn:
    id: "copy-map-get-us/alabama"
- extendedWaitUntil:
    visible:
      id: "map-ready-us/alabama"
    timeout: 120000
- takeScreenshot: 8-kit-copied
- tapOn:
    text: "Library"
    label: "The copied book, in the library"
- extendedWaitUntil:
    visible:
      id: "ready-ready.gov_en_all"
    timeout: 120000
- takeScreenshot: 9-copied
# Ask: Search finds the best passages in the books on this phone, and one opens its page, read from the book's file
- tapOn:
    text: "Ask"
    label: "Ask: Search finds the best passages"
- tapOn:
    id: "ask-question"
- inputText: "What are the signs of dehydration?"
- tapOn:
    id: "ask-search"
- extendedWaitUntil:
    visible: "Best passages from your library"
    timeout: 30000
- assertVisible: ".*dark urine.*"
- takeScreenshot: 10-ask
- tapOn:
    id: "passage-0"
    label: "A passage opens its page in the book"
# the book's page, not the passage's words on Ask
- extendedWaitUntil:
    visible:
      id: "book-home"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Oral rehydration solution.*"
    timeout: 30000
- takeScreenshot: 11-reading
# The book's home page
- tapOn:
    id: "book-home"
    label: "The book's home page"
- extendedWaitUntil:
    visible: "When to seek urgent help"
    timeout: 30000
# Search finds pages by title, and Back returns to the page before,
- tapOn:
    id: "search-book"
    label: "Search the book by title"
- inputText: "Dehy"
# by its id: the keyboard suggests "Dehydration" too
- tapOn:
    id: "found-Dehydration"
- extendedWaitUntil:
    visible: ".*Oral rehydration solution.*"
    timeout: 30000
- takeScreenshot: 12-found
- tapOn:
    id: "book-back"
- extendedWaitUntil:
    visible: "When to seek urgent help"
    timeout: 30000
# and by the words in them, from the book's own index
- tapOn:
    id: "search-book"
    label: "Search the book by the words in its pages"
- inputText: "dark urine"
- tapOn:
    id: "inside-Dehydration"
- extendedWaitUntil:
    visible: ".*Oral rehydration solution.*"
    timeout: 30000
- tapOn:
    id: "book-back"
- extendedWaitUntil:
    visible: "When to seek urgent help"
    timeout: 30000
# Share with a phone: this phone shared like a kit at home, as another phone on its Wi-Fi sees it (e2e/share.js). The
# app starts again, so Get more opens at its own screen.
- launchApp
- tapOn: "Get more"
- tapOn:
    id: "share-phone"
    label: "Share with a phone, behind a code"
- tapOn:
    text: "Allow" # iOS asks to find devices on the local network, where it shows the question
    optional: true
- extendedWaitUntil:
    visible:
      id: "share-on"
    timeout: 30000
- takeScreenshot: 13-share
- copyTextFrom:
    id: "share-code"
- runScript: share.js
- assertTrue: ${output.shared == "ok"}
