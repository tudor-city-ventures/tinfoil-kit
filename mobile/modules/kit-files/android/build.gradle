plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.tinfoilkit'
version = '1.0.0'

android {
  namespace "expo.modules.kitfiles"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    // The app's release build shrinks and renames its code (R8): proguard-rules.pro keeps what zstd-jni needs
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // The AI built into the phone (Gemini Nano): see AI.kt. Its betas after this one need a newer Kotlin than Expo's
  implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
  // zstd's decoder, for the books' clusters: see Clusters in Books.kt. Its later builds need compileSdk 37
  implementation 'com.github.luben:zstd-jni:1.5.7-4@aar'
}
